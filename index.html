<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/contabilita-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Note private">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Note">
  <link rel="apple-touch-icon" href="icons/nota-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Note</title>
  <meta name="app-version" content="14">
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { background: #0E1621; margin: 0; }
  </style>
</head>
<body>
  <div id="velo-privacy" style="position:fixed;inset:0;background:#0A0F16;z-index:2147483647;display:none;align-items:center;justify-content:center;">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#7A9CC4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="10" width="16" height="11" rx="2.5"></rect>
      <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
    </svg>
  </div>
  <script>
    (function () {
      var velo = document.getElementById('velo-privacy');
      var ultimoCopri = 0;
      function copri() { ultimoCopri = Date.now(); velo.style.display = 'flex'; }
      function scopri() { velo.style.display = 'none'; }
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') { copri(); }
        else { scopri(); }
      });
      window.addEventListener('blur', copri);
      window.addEventListener('focus', function () {
        setTimeout(function () {
          if (Date.now() - ultimoCopri > 800) { scopri(); }
        }, 300);
      });
      window.addEventListener('pagehide', copri);
      window.addEventListener('pageshow', scopri);

      var yInizio = null;
      document.addEventListener('touchstart', function (e) {
        yInizio = e.touches[0].clientY;
        if (document.visibilityState === 'visible' && Date.now() - ultimoCopri > 500) { scopri(); }
      }, { passive: true });
      document.addEventListener('touchmove', function (e) {
        if (yInizio === null) return;
        var y = e.touches[0].clientY;
        if (yInizio > window.innerHeight - 34 && y < yInizio - 30) { copri(); }
      }, { passive: true });
      document.addEventListener('touchcancel', copri);

      var versioneMia = document.querySelector('meta[name="app-version"]').content;
      function controllaAggiornamento() {
        fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (d) {
            if (d && d.v && String(d.v) !== String(versioneMia)) {
              var ora = Date.now();
              var ultimo = Number(sessionStorage.getItem('ultimo-tentativo') || 0);
              if (ora - ultimo > 30000) {
                sessionStorage.setItem('ultimo-tentativo', String(ora));
                var base = location.href.split('?')[0].split('#')[0];
                location.replace(base + '?agg=' + ora);
              }
            }
          })
          .catch(function () {});
      }
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') {
          setTimeout(controllaAggiornamento, 400);
        }
      });
      setTimeout(controllaAggiornamento, 1500);
    })();
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw-v14.js');
      });
    }
  </script>
</body>
</html>
