<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/contabilita-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Note private">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Note">
  <link rel="apple-touch-icon" href="icons/nota-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Note</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { background: #0E1621; margin: 0; }
  </style>
</head>
<body>
  <div id="velo-privacy" style="position:fixed;inset:0;background:#0A0F16;z-index:2147483647;display:none;align-items:center;justify-content:center;">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#7A9CC4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="10" width="16" height="11" rx="2.5"></rect>
      <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
    </svg>
  </div>
  <script>
    (function () {
      var velo = document.getElementById('velo-privacy');
      function copri() { velo.style.display = 'flex'; }
      function scopri() { velo.style.display = 'none'; }
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') { copri(); }
        else { scopri(); }
      });
      window.addEventListener('blur', copri);
      window.addEventListener('focus', scopri);
      window.addEventListener('pagehide', copri);
      window.addEventListener('pageshow', scopri);
      document.addEventListener('visibilitychange', scopri);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
