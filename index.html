<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/contabilita-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Note private">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Note">
  <link rel="apple-touch-icon" href="icons/nota-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Note</title>
  <meta name="app-version" content="15">
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { background: #0E1621; margin: 0; }
  </style>
</head>
<body>
  <div id="velo-privacy" style="position:fixed;inset:0;background:#0A0F16;z-index:2147483647;display:none;align-items:center;justify-content:center;">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#7A9CC4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="10" width="16" height="11" rx="2.5"></rect>
      <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
    </svg>
  </div>
  <div id="palla-spia" style="position:fixed;top:76px;right:10px;width:38px;height:38px;border-radius:50%;background:rgba(220,38,38,.85);z-index:99999;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;user-select:none;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4);">SP</div>
  <div id="pannello-spia" style="position:fixed;inset:0;background:rgba(5,8,12,.96);z-index:999999;display:none;flex-direction:column;padding:16px;gap:10px;">
    <div style="color:#fff;font-weight:700;">Diagnostica switch</div>
    <textarea id="testo-spia" readonly style="flex:1;width:100%;background:#111;color:#9f9;font-size:11px;font-family:monospace;padding:10px;border:1px solid #333;border-radius:8px;box-sizing:border-box;"></textarea>
    <div style="display:flex;gap:8px;">
      <button id="copia-spia" style="flex:1;padding:12px;border:none;border-radius:10px;background:#2563EB;color:#fff;font-weight:700;">Copia</button>
      <button id="svuota-spia" style="flex:1;padding:12px;border:none;border-radius:10px;background:#333;color:#fff;font-weight:700;">Svuota</button>
      <button id="chiudi-spia" style="flex:1;padding:12px;border:none;border-radius:10px;background:#555;color:#fff;font-weight:700;">Chiudi</button>
    </div>
  </div>
  <script>
    (function () {
      var t0 = Date.now();
      var LOG = [];
      try { LOG = JSON.parse(localStorage.getItem('spia-log') || '[]'); } catch (e) { LOG = []; }
      function spia(e, extra) {
        try {
          LOG.push({ e: e, d: Date.now() - t0, v: document.visibilityState, f: document.hasFocus(), x: extra || '' });
          if (LOG.length > 300) LOG = LOG.slice(-300);
          localStorage.setItem('spia-log', JSON.stringify(LOG));
        } catch (err) {}
      }
      window.__spia = spia;
      spia('avvio');

      var velo = document.getElementById('velo-privacy');
      var ultimoCopri = 0;
      function copri() { ultimoCopri = Date.now(); velo.style.display = 'flex'; spia('VELO ON', Date.now() - ultimoCopri === 0 ? '' : ''); }
      function scopri() { velo.style.display = 'none'; spia('VELO OFF'); }

      document.addEventListener('visibilitychange', function () {
        spia('visibility:' + document.visibilityState);
        if (document.visibilityState === 'hidden') { copri(); }
        else { scopri(); }
      });
      window.addEventListener('blur', function () { spia('blur'); copri(); });
      window.addEventListener('focus', function () {
        spia('focus');
        setTimeout(function () {
          if (Date.now() - ultimoCopri > 800) { scopri(); }
          else { spia('focus-ignorato'); }
        }, 300);
      });
      window.addEventListener('pagehide', function () { spia('pagehide'); copri(); });
      window.addEventListener('pageshow', function () { spia('pageshow'); scopri(); });

      var yInizio = null;
      document.addEventListener('touchstart', function (e) {
        yInizio = e.touches[0].clientY;
        spia('touchstart y=' + Math.round(yInizio));
        if (document.visibilityState === 'visible' && Date.now() - ultimoCopri > 500) { scopri(); }
      }, { passive: true });
      document.addEventListener('touchmove', function (e) {
        if (yInizio === null) return;
        var y = e.touches[0].clientY;
        if (yInizio > window.innerHeight - 34 && y < yInizio - 30) { spia('swipe-basso', 'da ' + Math.round(yInizio) + ' a ' + Math.round(y)); copri(); }
      }, { passive: true });
      document.addEventListener('touchcancel', function () { spia('touchcancel'); copri(); });

      var palla = document.getElementById('palla-spia');
      var pannello = document.getElementById('pannello-spia');
      var testo = document.getElementById('testo-spia');
      function mostraLog() {
        var righe = LOG.slice(-60).map(function (l) {
          return '+' + String(l.d).padStart(6, '0') + 'ms  ' + l.e + '  v=' + l.v + ' f=' + l.f + (l.x ? '  ' + l.x : '');
        });
        testo.value = righe.join('\n') || 'vuoto';
      }
      palla.addEventListener('click', function () { mostraLog(); pannello.style.display = 'flex'; });
      document.getElementById('chiudi-spia').addEventListener('click', function () { pannello.style.display = 'none'; });
      document.getElementById('svuota-spia').addEventListener('click', function () { LOG = []; localStorage.setItem('spia-log', '[]'); mostraLog(); });
      document.getElementById('copia-spia').addEventListener('click', function () {
        testo.select();
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) {}
        if (!ok && navigator.clipboard) { navigator.clipboard.writeText(testo.value).catch(function () {}); }
      });

      var versioneMia = document.querySelector('meta[name="app-version"]').content;
      function controllaAggiornamento() {
        fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (d) {
            if (d && d.v && String(d.v) !== String(versioneMia)) {
              var ora = Date.now();
              var ultimo = Number(sessionStorage.getItem('ultimo-tentativo') || 0);
              if (ora - ultimo > 30000) {
                sessionStorage.setItem('ultimo-tentativo', String(ora));
                var base = location.href.split('?')[0].split('#')[0];
                location.replace(base + '?agg=' + ora);
              }
            }
          })
          .catch(function () {});
      }
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') {
          setTimeout(controllaAggiornamento, 400);
        }
      });
      setTimeout(controllaAggiornamento, 1500);
    })();
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw-v15.js');
      });
    }
  </script>
</body>
</html>
